# leannginx configuration — the same syntax as nginx.conf.
# Run from the project directory:   .lake/build/bin/lnginx            (or: lnginx -p /path/to/prefix)
# Test it:                          .lake/build/bin/lnginx -t
# Relative paths (root, alias, access_log) are relative to the prefix (-p, default: cwd).

worker_processes  1;          # accepted, no effect (one process, many tasks)

events {
    worker_connections  1024;
}

http {
    include       mime.types;
    default_type  application/octet-stream;

    access_log    logs/access.log;
    keepalive_timeout  65;

    # gzip with lean-zip (verified DEFLATE); text/html is always included
    gzip  on;
    gzip_types  text/css text/plain application/javascript application/json image/svg+xml;
    gzip_vary  on;

    server {
        listen       127.0.0.1:8080;
        server_name  localhost;

        root   html;
        index  index.html index.htm;

        location / {
            try_files $uri $uri/ =404;
        }

        # Directory listings, e.g. http://localhost:8080/files/
        location /files/ {
            autoindex on;
        }

        location = /health {
            default_type text/plain;
            return 200 "ok\n";
        }

        location /old/ {
            return 301 /;
        }

        # Regex locations (~ case-sensitive, ~* case-insensitive), e.g. cache headers for images
        location ~* \.(png|jpe?g|gif|svg|ico|webp)$ {
            add_header Cache-Control "public, max-age=86400";
        }

        # Reverse proxy example (uncomment and point at a local app):
        # location /api/ {
        #     proxy_pass http://127.0.0.1:3000/;
        # }

        error_page  404              /404.html;
        error_page  500 502 503 504  /50x.html;
    }

    # HTTPS (TLS 1.3 via LeanTLS). Create a certificate first:  scripts/gen-cert.sh
    # then uncomment and open https://localhost:8443/
    #
    # server {
    #     listen       127.0.0.1:8443 ssl;
    #     server_name  localhost;
    #     ssl_certificate      localhost.crt;      # relative to this file's directory
    #     ssl_certificate_key  localhost.key;
    #     root   html;
    #     index  index.html;
    # }
}
