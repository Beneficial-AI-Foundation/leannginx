name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: build, audit, smoke
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      # Proof discipline (CLAUDE.md): no sorry/admit/native_decide in the sources.
      # grep exits 1 on "no match" (success here); a hit (exit 0) fails the step.
      - name: No sorry / admit / native_decide
        run: |
          if grep -rnE "\b(sorry|admit)\b|native_decide" LeanNginx Main.lean; then
            echo "::error::found sorry / admit / native_decide in the sources"
            exit 1
          fi

      # elan + the toolchain pinned in lean-toolchain, with the .lake cache.
      - name: Build the library and the lnginx binary
        uses: leanprover/lean-action@v1
        with:
          auto-config: false
          build: true
          build-args: "lnginx"
          use-github-cache: true

      # Axiom audit: ./audit.sh regenerates LeanNginx/Audit.lean and the build
      # fails if any spec depends on an axiom outside propext/Classical.choice/Quot.sound.
      - name: Axiom audit
        run: ./audit.sh

      # End-to-end smoke test of the built binary against the sample site.
      - name: Smoke test
        run: sh scripts/smoke.sh
